    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      name="description"
      content="CALOR MEGA — premium industrial food drying machines for jackfruit, banana, mango, pineapple, coconut, vegetables, herbs, spices and medicinal plants. Preserve freshness, increase profit, reduce food waste."

      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..800;1,500..800&family=Roboto+Condensed:wght@400;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700&display=swap"

    <title>CALOR MEGA | Premium Industrial Food Drying Solutions</title>
    <script>
      (function() {
        var path = window.location.pathname;
        if (path === '/admin' || path === '/admin/' || path === '/admin-dashboard' || path.endsWith('/admin')) {
          window.location.replace('/admin.html');
        }
      })();
      (function() {
        var isIframe = window.self !== window.top;
        var isPreview = window.location.search.includes('preview=true') || window.location.hash.includes('preview=true');
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (!isIframe && !isPreview && !isLocal && window.innerWidth <= 768 && !window.location.pathname.includes('/mobile/')) {
          window.location.replace('./mobile/');
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
